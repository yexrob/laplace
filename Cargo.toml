[package]
name = "laplace"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The intellect that knows every entity in your project and how they connect"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is archived; serde_norway is its maintained continuation with the same API.
serde_norway = "0.9"
unicode-normalization = "0.1"
